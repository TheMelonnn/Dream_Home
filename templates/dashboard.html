<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DreamHome</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #222;
        background: #f9f9f9;
      }
      header {
        position: sticky;
        top: 0;
        background: rgba(255, 255, 255, 0.95);
        padding: 12px 20px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        z-index: 10;
      }
      nav a {
        margin-right: 16px;
        color: #333;
        text-decoration: none;
        font-weight: 600;
      }
      .hero {
        height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f7f9fc, #eef3f8);
        text-align: center;
        padding: 20px;
      }
      .hero h1 {
        margin: 0 0 8px 0;
        font-size: 2.2rem;
      }
      .sections {
        padding: 40px 20px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .gallery {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .card {
        width: 320px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
      }
      .card .content {
        padding: 14px;
      }
      .dashboardbutton,
      button {
        background: #007bff;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.3s;
        font-size: 1.1rem;
      }
      footer {
        text-align: center;
        padding: 20px;
        color: #666;
        background: #fafafa;
        margin-top: 30px;
      }
      form input,
      form button {
        font-size: 1rem;
      }
      @media (max-width: 740px) {
        .card {
          width: 100%;
        }
        .hero {
          height: auto;
          padding: 40px 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav style="display: flex; align-items: center; gap: 1px">
        <a href="/#home" style="display: flex; align-items: center">
          <img
            src="static/image/applogo.png"
            alt="DreamHome Logo"
            style="height: 37px"
          />
        </a>
        <a href="/#gallery">Our Features</a>
        <a href="/#getstarted">Get Started</a>
        <a href="/dashboard">Dashboard</a>
      </nav>
    </header>

    <footer>© DreamHome</footer>
  </body>
</html>
